services:
  - type: web
    name: home-alarm-gateway
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @home-alarm/contracts && npm run build -w @home-alarm/gateway
    startCommand: npm run start -w @home-alarm/gateway
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "false"
      - key: PORT
        value: "10000"
      - key: PIN_PEPPER
        generateValue: true
      - key: MQTT_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
